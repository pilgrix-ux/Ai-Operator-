name: AI Operator CI
on:
  push:
    branches: [main, feature/3d-shooter-foundation]
  pull_request:
    branches: [main, feature/3d-shooter-foundation]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate JavaScript syntax
        run: |
          set -e
          find src -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Check required runtime files
        run: |
          test -f index.html
          test -f src/main.js
          test -f src/game/movementController.js
          test -f src/game/weaponSystem.js
          test -f src/game/equipmentSystem.js
      - name: Check unresolved local imports
        run: node scripts/check-local-imports.mjs
